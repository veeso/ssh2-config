[package]
name = "ssh2-config"
version = "0.8.0"
authors = ["Christian Visintin <christian.visintin@veeso.dev>"]
build = "build/main.rs"
categories = ["network-programming"]
documentation = "https://docs.rs/ssh2-config"
edition = "2024"
homepage = "https://veeso.github.io/ssh2-config/"
include = [
    "build/**/*",
    "examples/**/*",
    "src/**/*",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]
keywords = ["ssh2", "ssh", "ssh-config", "ssh-config-parser"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/veeso/ssh2-config"
rust-version = "1.88.0"
description = "an ssh configuration parser for ssh2-rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
nolog = ["log/max_level_off"]
reload-ssh-algo = ["dep:anyhow", "dep:git2"]

[dependencies]
bitflags = "2"
dirs = "6"
glob = "0.3"
log = "0.4"
thiserror = "2"
wildmatch = "2"

[dev-dependencies]
env_logger = "0.11"
pretty_assertions = "1"
rpassword = "7"
ssh2 = "0.9"
tempfile = "3"

[build-dependencies]
anyhow = { version = "1", optional = true }
git2 = { version = "0.21", default-features = false, features = [
    "https",
], optional = true }

[[example]]
name = "client"
path = "examples/client.rs"

[[example]]
name = "query"
path = "examples/query.rs"

[[example]]
name = "print"
path = "examples/print.rs"
